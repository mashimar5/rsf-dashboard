name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest

    # The suite needs a real Postgres: AT TIME ZONE and percentile_cont have
    # no in-memory substitute, and testing against a different engine than
    # production runs would defeat the point of moving the curve into SQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      RSF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsf_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsf_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Installs from requirements.txt only, on a machine that has never seen
      # this project. This is what catches a dependency that works locally
      # because it was installed months ago and never declared.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The suite mocks every HTTP call and reads the hours parser's fixture
      # from disk, so it needs no network, no database and no secrets.
      - name: Run tests
        run: python -m unittest discover -p 'test_*.py' --verbose

      # Structural claims only -- routes, environment variables, file names.
      # Prose drift ("the token is cached") is not mechanically checkable and
      # still needs a reader.
      - name: Check the README against the code
        run: python tools/check_readme.py

      # The forest and its backtest need numpy and scikit-learn, which the app
      # never imports and the Docker image never installs. They go in after
      # the main suite, so that suite still proves requirements.txt is enough
      # for the app on its own.
      - name: Install modelling dependencies
        run: pip install -r requirements-ml.txt

      - name: Run model tests
        run: python -m unittest test_forest --verbose

  frontend:
    name: TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs the exact lockfile versions and fails if package.json
      # and the lockfile disagree, which npm install would quietly paper over.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy is a multi-stage build; if it breaks, `fly deploy` fails at
      # the point of deploying rather than here, where it is cheap to notice.
      - name: Build the image
        run: docker build -t rsf-dashboard:ci .
