# App name must be globally unique; `fly launch` will offer to rename it.
app = "rsf-dashboard"
primary_region = "sjc"

[build]

[env]
  # 240 rather than 300: Neon's free tier suspends the compute after about
  # five minutes idle, so a five-minute collection interval sits exactly on
  # the boundary and pays a cold start most cycles. Four minutes keeps it warm.
  COLLECT_INTERVAL = "240"
  RSF_HOURS_CACHE = "/data/hours_cache.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Must stay false. Fly's default is to sleep idle machines, which would
  # stop the collector whenever nobody is looking at the dashboard.
  auto_stop_machines = false
  min_machines_running = 1

  # Restarts only for conditions a restart can fix: the database unreachable,
  # or the collector thread dead while gunicorn kept serving. Stale readings
  # are reported by /health but do not fail it -- if the sensor API is down,
  # restarting in a loop turns one outage into two.
  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[mounts]
  source = "rsf_data"
  destination = "/data"
